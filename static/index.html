<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3f5b34">
  <meta name="description" content="Encuentra paradas y rutas de transporte público en Puebla.">
  <title>Rutas Puebla · Encuentra tu parada</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="encabezado encabezado--compacto">
    <div class="encabezado__contenido">
      <p class="sello">Camino real · Puebla de Zaragoza</p>
      <h1>🚌 Rutas Puebla</h1>
      <p class="lema">Encuentra tu parada, conoce tus rutas y llega a buen camino.</p>
    </div>
    <svg class="colinas" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="colina colina--lejos" d="M0,70 C150,20 300,90 480,55 C660,20 820,85 1000,45 C1100,25 1160,50 1200,60 L1200,120 L0,120 Z"/>
      <path class="colina colina--cerca" d="M0,95 C200,55 380,110 600,80 C820,50 980,105 1200,75 L1200,120 L0,120 Z"/>
    </svg>
  </header>

  <main class="publico">

    <!-- Controles del pasajero -->
    <section class="panel controles" aria-label="Buscar paradas">
      <button id="btn-cerca" class="btn btn--principal btn--grande" type="button">
        📍 Paradas cerca de mí
      </button>

      <div class="campo">
        <label for="filtro-ruta">¿Qué ruta tomas?</label>
        <select id="filtro-ruta">
          <option value="">Todas las rutas</option>
        </select>
      </div>

      <div class="campo">
        <label for="buscador">Buscar parada o colonia</label>
        <input type="search" id="buscador" placeholder="Ej. Centro, BUAP, Ruta 15…" autocomplete="off">
      </div>

      <label class="casilla">
        <input type="checkbox" id="solo-activas" checked>
        Mostrar solo paradas activas
      </label>

      <div id="mensaje" role="status" aria-live="polite"></div>
      <div id="chips-rutas" class="chips" aria-label="Rutas disponibles"></div>
    </section>

    <!-- Mapa -->
    <section class="panel panel-mapa-publico" aria-label="Mapa">
      <div class="leyenda">
        <span><i class="punto punto--activa"></i> Activa</span>
        <span><i class="punto punto--inactiva"></i> Inactiva</span>
        <span><i class="punto punto--yo"></i> Tú</span>
      </div>
      <div id="mapa"></div>
    </section>

    <!-- Resultados -->
    <section class="panel resultados" aria-labelledby="titulo-resultados">
      <div class="resultados__cabecera">
        <h2 id="titulo-resultados">🌾 Paradas</h2>
        <button id="btn-todas" class="btn btn--chico btn--gris oculto" type="button">Ver todas</button>
      </div>
      <p id="contador" class="ayuda"></p>
      <div id="lista-paradas"></div>
    </section>
  </main>

  <footer class="pie">
    <p>Rutas Puebla · Datos en Redis Cloud · Mapa © OpenStreetMap</p>
    <p><a href="/admin">Acceso administrador</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/comun.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
